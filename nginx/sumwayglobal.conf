# ==============================================================================
# Sumway Global Management - Nginx Reverse Proxy & Production Server Config
# Location: /etc/nginx/sites-available/sumwayglobal.conf
# Enable: sudo ln -s /etc/nginx/sites-available/sumwayglobal.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Upstream Next.js Server Pool
upstream nextjs_upstream {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

# 1. HTTP Server - Redirects all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sumwayglobal.com www.sumwayglobal.com;

    # Certbot ACME Challenge location for SSL Renewal
    location ~ /\.well-known/acme-challenge {
        allow all;
        root /var/www/html;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Reverse Proxy for Next.js Application
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sumwayglobal.com www.sumwayglobal.com;

    # SSL Certificates (Update paths after running Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/sumwayglobal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sumwayglobal.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/sumwayglobal.com/chain.pem;

    # SSL Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS (Strict-Transport-Security)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Maximum upload size (for job resumes & media uploads)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # Cache Next.js Immutable Static Build Assets (/_next/static/)
    location /_next/static/ {
        alias /var/www/sumway/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache Public Static Media (Images, Icons, Fonts)
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|webm|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        proxy_pass http://nextjs_upstream;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, access-plus-30-days";
    }

    # Proxy all application requests to Next.js App Server
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        # WebSocket & Server-Sent Events Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Forward Client Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts for Long Requests / Uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable buffering for low latency response streaming
        proxy_buffering off;
    }
}
